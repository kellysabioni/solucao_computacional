<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Usuários</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-slate-900 text-white shadow-sm">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <div class="text-xl font-bold tracking-wider flex items-center gap-2">
          <a href="index.html" class="hover:text-indigo-400 transition"
            ><i class="fa-solid :fa-laptop-code text-indigo-400"></i> Solução
            Computacional</a
          >
        </div>
        <div class="flex gap-6">
          <a href="usuarios.html" class="text-indigo-400 font-medium"
            >Usuários</a
          >
          <a
            href="projetos.html"
            class="hover:text-indigo-400 transition font-medium"
            >Projetos</a
          >
          <a
            href="equipes.html"
            class="hover:text-indigo-400 transition font-medium"
            >Equipes</a
          >
        </div>
      </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-8 space-y-8">
      <h1 class="text-3xl font-extrabold text-slate-900">
        Gerenciamento de Usuários
      </h1>

      <div
        id="mensagemUsuario"
        class="hidden p-4 rounded-lg font-medium text-sm"
      ></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div
          class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 h-fit"
        >
          <h2 class="text-lg font-semibold mb-4 text-slate-900">
            Novo Usuário
          </h2>
          <form id="formUsuario" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Nome Completo</label
              >
              <input
                type="text"
                id="nomeCompleto"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >CPF</label
              >
              <input
                type="text"
                id="cpf"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >E-mail</label
              >
              <input
                type="email"
                id="email"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Cargo</label
              >
              <input
                type="text"
                id="cargo"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Login</label
              >
              <input
                type="text"
                id="login"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Senha</label
              >
              <input
                type="password"
                id="senha"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Perfil</label
              >
              <select
                id="perfil"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500 bg-white"
              >
                <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                <option value="GERENTE">GERENTE</option>
                <option value="COLABORADOR">COLABORADOR</option>
              </select>
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition shadow-xs"
            >
              Salvar Usuário
            </button>
          </form>
        </div>

        <div
          class="lg:col-span-2 bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden h-fit"
        >
          <div
            class="p-5 border-b border-slate-100 flex justify-between items-center"
          >
            <h3 class="font-semibold text-slate-900">Usuários Cadastrados</h3>
          </div>
          <div class="overflow-x-auto">
            <table id="tabelaUsuarios" class="w-full text-left border-collapse">
              <thead
                class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold"
              >
                <tr>
                  <th class="p-4 border-b border-slate-100">Nome</th>
                  <th class="p-4 border-b border-slate-100">CPF</th>
                  <th class="p-4 border-b border-slate-100">E-mail</th>
                  <th class="p-4 border-b border-slate-100">Login</th>
                  <th class="p-4 border-b border-slate-100">Perfil</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_URL = "http://localhost:8080/usuarios";

      function exibirMensagem(texto, erro = false) {
        const box = document.getElementById("mensagemUsuario");
        box.innerText = texto;
        box.className = `p-4 rounded-lg font-medium text-sm ${erro ? "bg-rose-50 text-rose-600 border border-rose-200" : "bg-emerald-50 text-emerald-600 border border-emerald-200"}`;
        box.classList.remove("hidden");
      }

      async function listarUsuarios() {
        try {
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error();
          const usuarios = (await res.ok) ? await res.json() : [];

          const tbody = document
            .getElementById("tabelaUsuarios")
            .querySelector("tbody");
          tbody.innerHTML =
            usuarios.length === 0
              ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum usuário encontrado.</td></tr>`
              : "";

          usuarios.forEach((u) => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-50 transition";
            tr.innerHTML = `
                        <td class="p-4 font-medium text-slate-900">${u.nomeCompleto}</td>
                        <td class="p-4 text-slate-500">${u.cpf}</td>
                        <td class="p-4 text-slate-500">${u.email}</td>
                        <td class="p-4 text-slate-500">${u.login}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-sm text-xs font-semibold ${u.perfil === "ADMINISTRADOR" ? "bg-purple-100 text-purple-700" : u.perfil === "GERENTE" ? "bg-amber-100 text-amber-700" : "bg-blue-100 text-blue-700"}">${u.perfil}</span></td>
                    `;
            tbody.appendChild(tr);
          });
        } catch {
          exibirMensagem("Erro ao carregar lista de usuários.", true);
        }
      }

      document
        .getElementById("formUsuario")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            nomeCompleto: document.getElementById("nomeCompleto").value,
            cpf: document.getElementById("cpf").value,
            email: document.getElementById("email").value,
            cargo: document.getElementById("cargo").value,
            login: document.getElementById("login").value,
            senha: document.getElementById("senha").value,
            perfil: document.getElementById("perfil").value,
          };

          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (res.ok) {
              exibirMensagem("Usuário cadastrado com sucesso!");
              document.getElementById("formUsuario").reset();
              listarUsuarios();
            } else {
              exibirMensagem("Erro ao cadastrar usuário no servidor.", true);
            }
          } catch {
            exibirMensagem(
              "Não foi possível conectar ao servidor backend.",
              true,
            );
          }
        });

      document.addEventListener("DOMContentLoaded", listarUsuarios);
    </script>
  </body>
</html>
