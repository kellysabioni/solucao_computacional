<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Equipes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-slate-900 text-white shadow-sm">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <div class="text-xl font-bold tracking-wider flex items-center gap-2">
          <a href="index.html" class="hover:text-indigo-400 transition"
            ><i class="fa-solid :fa-laptop-code text-indigo-400"></i> Solução
            Computacional</a
          >
        </div>
        <div class="flex gap-6">
          <a
            href="usuarios.html"
            class="hover:text-indigo-400 transition font-medium"
            >Usuários</a
          >
          <a
            href="projetos.html"
            class="hover:text-indigo-400 transition font-medium"
            >Projetos</a
          >
          <a href="equipes.html" class="text-indigo-400 font-medium">Equipes</a>
        </div>
      </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-8 space-y-8">
      <h1 class="text-3xl font-extrabold text-slate-900">
        Gerenciamento de Equipes
      </h1>

      <div
        id="mensagemEquipe"
        class="hidden p-4 rounded-lg font-medium text-sm"
      ></div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div
          class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 h-fit"
        >
          <h2 class="text-lg font-semibold mb-4 text-slate-900">Nova Equipe</h2>
          <form id="formEquipe" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Nome da Equipe</label
              >
              <input
                type="text"
                id="nomeEquipe"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Descrição</label
              >
              <textarea
                id="descricaoEquipe"
                rows="2"
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
              ></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Membros (Segure Ctrl para selecionar + de 1)</label
              >
              <select
                id="membrosEquipe"
                multiple
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500 bg-white h-28"
              ></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1"
                >Projetos Vinculados (Segure Ctrl para selecionar + de 1)</label
              >
              <select
                id="projetosEquipe"
                multiple
                required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500 bg-white h-28"
              ></select>
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition shadow-xs"
            >
              Salvar Equipe
            </button>
          </form>
        </div>

        <div
          class="lg:col-span-2 bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden h-fit"
        >
          <div class="p-5 border-b border-slate-100">
            <h3 class="font-semibold text-slate-900">Equipes Cadastradas</h3>
          </div>
          <div class="overflow-x-auto">
            <table id="tabelaEquipes" class="w-full text-left border-collapse">
              <thead
                class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold"
              >
                <tr>
                  <th class="p-4 border-b border-slate-100">
                    Nome da Equipe / Descrição
                  </th>
                  <th class="p-4 border-b border-slate-100">
                    Logins dos Membros
                  </th>
                  <th class="p-4 border-b border-slate-100">
                    Projetos Atrelados
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>
      const BASE_URL = "http://localhost:8080";

      function exibirMensagem(texto, erro = false) {
        const box = document.getElementById("mensagemEquipe");
        box.innerText = texto;
        box.className = `p-4 rounded-lg font-medium text-sm ${erro ? "bg-rose-50 text-rose-600 border border-rose-200" : "bg-emerald-50 text-emerald-600 border border-emerald-200"}`;
        box.classList.remove("hidden");
      }

      async function preencherFiltros() {
        try {
          // Carregar Usuários
          const resUser = await fetch(`${BASE_URL}/usuarios`);
          const usuarios = resUser.ok ? await resUser.json() : [];
          const selectMembros = document.getElementById("membrosEquipe");
          selectMembros.innerHTML = "";
          usuarios.forEach((u) => {
            const opt = document.createElement("option");
            opt.value = u.login;
            opt.innerText = `${u.nomeCompleto} (${u.perfil})`;
            selectMembros.appendChild(opt);
          });

          // Carregar Projetos
          const resProj = await fetch(`${BASE_URL}/projetos`);
          const projetos = resProj.ok ? await resProj.json() : [];
          const selectProjetos = document.getElementById("projetosEquipe");
          selectProjetos.innerHTML = "";
          projetos.forEach((p) => {
            const opt = document.createElement("option");
            opt.value = p.nome;
            opt.innerText = p.nome;
            selectProjetos.appendChild(opt);
          });
        } catch {
          exibirMensagem(
            "Erro ao carregar dados de apoio para o formulário.",
            true,
          );
        }
      }

      async function listarEquipes() {
        try {
          const res = await fetch(`${BASE_URL}/equipes`);
          const equipes = res.ok ? await res.json() : [];
          const tbody = document
            .getElementById("tabelaEquipes")
            .querySelector("tbody");
          tbody.innerHTML =
            equipes.length === 0
              ? `<tr><td colspan="3" class="p-4 text-center text-slate-400">Nenhuma equipe encontrada.</td></tr>`
              : "";

          equipes.forEach((e) => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-50 transition";

            const membrosStr = e.loginsMembros
              ? e.loginsMembros.join(", ")
              : "-";
            const projetosStr = e.nomesProjetos
              ? e.nomesProjetos.join(", ")
              : "-";

            tr.innerHTML = `
                        <td class="p-4 font-medium text-slate-900">
                            <div>${e.nome}</div>
                            <div class="text-xs text-slate-400">${e.descricao}</div>
                        </td>
                        <td class="p-4 text-slate-600 text-xs">${membrosStr}</td>
                        <td class="p-4 text-slate-600 text-xs font-semibold">${projetosStr}</td>
                    `;
            tbody.appendChild(tr);
          });
        } catch {
          exibirMensagem("Erro ao carregar lista de equipes.", true);
        }
      }

      document
        .getElementById("formEquipe")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Tratamento de Select Multiple para Array
          const loginsMembros = Array.from(
            document.getElementById("membrosEquipe").selectedOptions,
          ).map((opt) => opt.value);
          const nomesProjetos = Array.from(
            document.getElementById("projetosEquipe").selectedOptions,
          ).map((opt) => opt.value);

          const payload = {
            nome: document.getElementById("nomeEquipe").value,
            descricao: document.getElementById("descricaoEquipe").value,
            loginsMembros: loginsMembros,
            nomesProjetos: nomesProjetos,
          };

          try {
            const res = await fetch(`${BASE_URL}/equipes`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (res.ok) {
              exibirMensagem("Equipe registrada com sucesso!");
              document.getElementById("formEquipe").reset();
              listarEquipes();
            } else {
              exibirMensagem("Erro ao cadastrar equipe no servidor.", true);
            }
          } catch {
            exibirMensagem("Erro de conexão com o servidor.", true);
          }
        });

      document.addEventListener("DOMContentLoaded", () => {
        preencherFiltros();
        listarEquipes();
      });
    </script>
  </body>
</html>
